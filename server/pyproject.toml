[project]
name = "server"
version = "0.1.0"
description = "OMNiBot 2000 — homelab AI processing server (STT + LLM + TTS)"
readme = "README.md"
authors = [
    { name = "Felipe Castro", email = "pipec800@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.1,<2.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "uvicorn[standard]>=0.52.1,<1.0.0",
    "piper-tts>=1.4.2,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.6",
    "soxr>=1.1.0,<2.0.0",
    "insightface>=1.0.1,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "numpy>=2.4.4,<3.0.0",
    "opencv-python>=5.0.0.93,<6.0.0.0",
    "pydantic>=2.13.3,<3.0.0",
    "starlette>=1.6.0,<2.0.0",
]

[project.scripts]
serve = "server.main:main"
personal-setup = "server.personal_setup:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# deptry runs scoped to this subpackage (uv run --directory server deptry .),
# so its config lives here rather than the workspace root — it does not see
# the root's virtual [project.dependencies]=[] otherwise.
[tool.deptry]
# deptry can't auto-detect this editable workspace member as first-party,
# so it misreads `server` importing itself as a transitive dependency.
known_first_party = ["server"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "python-multipart",  # required by FastAPI/Starlette for multipart form parsing, never imported by name
]
