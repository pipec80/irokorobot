# Retrieval bench of the diary's recall (Plan 0088 Part A, D-4). Every value is an invented
# canary of one invented owner: no household data. A regression bench, not a calibration of the
# robot's real speech (D-3); the hardware acceptance of D-7 is the real check.
#
# today: the household day of the run. A unit's `day` is the household day it was told (said at
# 12:00 local). A question's `raw` is written as the speech-to-text writes it (Task A0 Step 4):
# the first word capitalized after «¿», a name capitalized mid-sentence. `strength` is the cue
# strength `classify_recall_cue` must give; `half` is `tune` or `check` (D-3); `expected` lists the
# unit ids it should find, empty when the right answer is none; `vector_off` runs the question with
# the embedding model unreachable.
version: 1
today: "2026-11-20"
owner: Canario Bench

