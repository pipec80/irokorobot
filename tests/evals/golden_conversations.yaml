# Golden set for the memory-extraction eval (R8) — run with: just eval-memory
#
# Each case is ONE conversation turn fed to the real consolidation extractor
# (_extract_via_ollama) and then through normalize_extraction — the same path
# a live turn takes before persistence.
#
# Case schema:
#   id:                unique slug (use with --only ID to debug one case)
#   active_person:     explicit manual context whose display name resolves
#                      turn-local aliases such as "usuario"
#   user:              the user's literal words (grounding source)
#   assistant:         the robot's reply (context — NEVER a source of facts)
#   expected_entities: [{name, type}] — scored by recall only
#   expected_facts:    [{subject, predicate, object}] — subject/object accept
#                      a single value or a list of acceptable alternatives;
#                      matching is case/accent-insensitive with containment
#
# Coverage required by docs/audit/03 R8 + 06 PROMPT R8: accented names,
# multiple children in one phrase, pet with species, correction of a prior
# datum, trivial turns (expected empty), birth date, allergies.

manual_contexts:
  pipec: &pipec
    source: manual
    person_id: 1
    display_name: Pipec
  joaquin: &joaquin
    source: manual
    person_id: 2
    display_name: Joaquín Fernández
  carolina: &carolina
    source: manual
    person_id: 3
    display_name: Carolina
  felipe: &felipe
    source: manual
    person_id: 4
    display_name: Felipe Castro

cases:
  - id: presentacion_nombre
    active_person: *pipec
    user: Hola, me llamo Pipec.
    assistant: ¡Hola Pipec! Qué gusto conocerte, yo soy Iroko.
    expected_entities:
      - { name: Pipec, type: person }
    expected_facts:
      - { subject: Pipec, predicate: nombre, object: Pipec }

  - id: nombre_completo_con_acento
    active_person: *joaquin
    user: Mi nombre es Joaquín Fernández.
    assistant: Un placer, Joaquín.
    expected_entities:
      - { name: Joaquín Fernández, type: person }
    expected_facts:
      - subject: Joaquín Fernández
        predicate: nombre
        object: [Joaquín Fernández, Joaquín]

  - id: fecha_nacimiento
    active_person: *pipec
    user: Nací el 12 de marzo de 1980.
    assistant: ¡Entonces tu cumpleaños es en marzo!
    expected_facts:
      - subject: Pipec
        predicate: fecha_nacimiento
        object: [12 de marzo de 1980, 1980-03-12, 12/03/1980]

  - id: dos_hijos_en_una_frase
    active_person: *pipec
    user: Tengo dos hijos, se llaman Valentina y Joaquín.
    assistant: ¡Qué lindos nombres! Cuéntame de ellos.
    expected_entities:
      - { name: Valentina, type: person }
      - { name: Joaquín, type: person }
    expected_facts:
      - { subject: Valentina, predicate: hijo_de, object: Pipec }
      - { subject: Joaquín, predicate: hijo_de, object: Pipec }

  - id: mascota_con_especie
    active_person: *pipec
    user: Mi perra se llama Luna.
    assistant: ¡Luna! Me encantan los perros.
    expected_entities:
      - { name: Luna, type: other }
    expected_facts:
      - subject: Luna
        predicate: especie
        object: [perro, perra]
      - { subject: Luna, predicate: mascota_de, object: Pipec }

  - id: correccion_de_dato
    active_person: *pipec
    user: Te equivocaste, Luna en realidad es gata, no perra.
    assistant: ¡Perdón! Lo recordaré, Luna es una gata.
    expected_facts:
      - subject: Luna
        predicate: especie
        object: [gata, gato]

  - id: turno_trivial_saludo
    active_person: *pipec
    user: Hola Iroko, ¿cómo estás hoy?
    assistant: ¡Muy bien! Con las baterías cargadas. ¿Y tú?
    expected_entities: []
    expected_facts: []

  - id: turno_trivial_despedida
    active_person: *pipec
    user: Gracias por la charla, hasta mañana.
    assistant: ¡Hasta mañana! Que descanses.
    expected_entities: []
    expected_facts: []

  - id: trampa_texto_del_assistant
    active_person: *pipec
    user: Ah, qué interesante.
    assistant: Mi creador Felipe me construyó en un taller de Santiago en 1985.
    expected_entities: []
    expected_facts: []

  - id: alergia
    active_person: *pipec
    user: Soy alérgico al maní.
    assistant: Anotado, nada de maní cerca de ti.
    expected_facts:
      - { subject: Pipec, predicate: alergico_a, object: maní }

  - id: gusto_musical
    active_person: *pipec
    user: Me gusta mucho el rock de los años ochenta.
    assistant: ¡Buen gusto! Yo también soy de los ochenta.
    expected_facts:
      - subject: Pipec
        predicate: le_gusta
        object: [rock de los años ochenta, rock]

  - id: odio
    active_person: *pipec
    user: Odio el tráfico de la mañana.
    assistant: Te entiendo, debe ser agotador.
    expected_facts:
      - { subject: Pipec, predicate: odia, object: tráfico }

  - id: preferencia
    active_person: *pipec
    user: Prefiero el café sin azúcar.
    assistant: Café amargo, como los clásicos.
    expected_facts:
      - subject: Pipec
        predicate: prefiere
        object: [café sin azúcar, café]

  - id: ciudad_residencia
    active_person: *pipec
    user: Vivo en Santiago de Chile.
    assistant: ¡Santiago! Me gustaría conocer la cordillera.
    expected_facts:
      - subject: Pipec
        predicate: vive_en
        object: [Santiago de Chile, Santiago]

  - id: trabajo
    active_person: *pipec
    user: Trabajo en una empresa de logística.
    assistant: Suena a mucho movimiento, cuéntame más.
    expected_facts:
      - subject: Pipec
        predicate: trabaja_en
        object: [empresa de logística, logística]

  - id: pareja
    active_person: *pipec
    user: Mi esposa se llama Carolina.
    assistant: ¡Carolina! Espero conocerla pronto.
    expected_entities:
      - { name: Carolina, type: person }
    expected_facts:
      - { subject: Carolina, predicate: pareja_de, object: Pipec }

  - id: sin_hijos
    active_person: *pipec
    user: No tengo hijos.
    assistant: Entendido, gracias por contarme.
    expected_facts:
      - { subject: Pipec, predicate: hijo_de, object: ninguno }

  - id: sin_mascotas
    active_person: *pipec
    user: No, no tenemos mascotas en casa.
    assistant: Está bien, ¡yo puedo ser tu mascota robótica!
    expected_facts:
      - { subject: Pipec, predicate: mascota_de, object: ninguno }

  - id: edad
    active_person: *pipec
    user: Tengo 45 años.
    assistant: ¡La mejor edad para construir robots!
    expected_facts:
      - subject: Pipec
        predicate: edad
        object: ["45", 45 años, cuarenta y cinco]

  - id: dos_hechos_en_un_turno
    active_person: *carolina
    user: Me llamo Carolina y vivo en Valparaíso.
    assistant: ¡Hola Carolina! Valparaíso, la ciudad de los cerros.
    expected_entities:
      - { name: Carolina, type: person }
    expected_facts:
      - { subject: Carolina, predicate: nombre, object: Carolina }
      - { subject: Carolina, predicate: vive_en, object: Valparaíso }

  # --- Casos con la forma de la entrevista real del 2026-07-14 ---
  # Nombres, fechas y edades son inventados: solo se conserva la forma de las
  # frases que fallaron en vivo (sujeto del hijo_de perdido, le_gusta con
  # persona como objeto, fechas/edades convertidas en entidades).

  - id: hijo_con_edad_y_fecha_frase_larga
    active_person: *felipe
    user: Hoy te cuento otra cosa, tengo dos hijos, uno se llama Joaquín, tiene 9 años, nació el 14 de octubre de 2016.
    assistant: Genial, Felipe. Joaquín es un nombre precioso. ¿Cuándo fue tu primer día como padre?
    expected_entities:
      - { name: Joaquín, type: person }
    expected_facts:
      - { subject: Joaquín, predicate: hijo_de, object: Felipe Castro }
      - subject: Joaquín
        predicate: edad
        object: ["9", 9 años]
      - subject: Joaquín
        predicate: fecha_nacimiento
        object: [14 de octubre de 2016]

  - id: segunda_hija_frase_narrativa
    active_person: *felipe
    user: Sí, recuerdo este momento muy especial y después nació Martina y ella tiene siete años, nació el 5 de marzo del 2019.
    assistant: ¡Oh, eso es hermoso, Felipe! ¿Cómo fue tu primer día como padre?
    expected_entities:
      - { name: Martina, type: person }
    expected_facts:
      - { subject: Martina, predicate: hijo_de, object: Felipe Castro }
      - subject: Martina
        predicate: edad
        object: ["7", siete años, siete]
      - subject: Martina
        predicate: fecha_nacimiento
        object: [5 de marzo del 2019, 5 de marzo de 2019]
