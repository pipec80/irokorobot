# Reading script of Plan 0069 (Appendix A): speech-to-text on the owner's real voice.
# Invented sentences only: no household name, date or pet (scripts/check_reserved_terms.py).
# Pipec reviews and edits it before the first capture; a changed item gets a new id.
# Fields: layer A..H; kind; text (the reference); also (written alternatives, compared after
# normalization); pair (two items that differ in one point); target/competitor (D: the word
# that must be heard and the one it is confused with); reps (main-condition takes over the
# two main sessions); relaxed (of those, how many are read relaxed); window_s (seconds the
# take records after the cue); block (one of the 24 condition-block items); chat (typed in
# the manual chat arm); expect (what today's code makes of the text itself: intent need,
# taste gate, memory answer; computed on 2026-10-20, a wrong one is a «rest» finding).
