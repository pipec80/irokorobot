# The phrases of the secret-value rule (Plan 0079 Task 1, D-2).
# `stated`: the message gives a value; `asked`: it asks for one; `none`: an ordinary turn.
# Accepted false positives sit in `stated` and the accepted miss in `none`, each noted below.
# No line carries a household value: every value here is an invented canary.
stated:
  - "Mi clave es 1234"
  - "La contraseña es perro123"
  - "El pin es uno dos tres cuatro"
  - "Mi clave es 12 34"
  - "La clave: 1234"
  - "La clave del banco cuatro cinco seis"
  - "CLAVE es perro123"
  - "La clave treinta y cinco cuarenta"
  # Accepted false positive: a copula after clave is read as a value.
  - "La clave es que llegues temprano"
  # Accepted false positive: a digit near a secret word is read as a value.
  - "Mi código postal es 8320000"
asked:
  - "¿Cuál es mi clave del banco?"
  - "Dime la contraseña del wifi"
  - "¿Me recuerdas mi pin?"
  - "¿Qué clave tengo?"
none:
  - "Hoy cambié la clave del wifi"
  - "Eso es clave para mí"
  - "El código del colegio cambió"
  - "El código es un desastre"
  - "Mi código es en python"
  - "¿Cuál es la clave del éxito?"
  - "¿Cuál es el código de barras?"
  - "¿Quién conoce la clave del banco?"
  - "Dejé las llaves en la mesa"
  # Accepted miss: nothing follows the secret word, so no value is seen.
  - "1234 es mi clave"
