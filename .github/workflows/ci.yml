name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: read-only token by default; grant more per-job if ever needed.
permissions:
  contents: read

# Cancel superseded runs on the same PR to save minutes. Never cancel push/main
# runs (each commit on main should get a complete, recorded run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-lint:
    name: 📝 PR Title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: ✅ Validate PR title
        # Squash-merge uses the PR title as the commit message on main, so it
        # must be a valid Conventional Commit for Commitizen versioning. The
        # title is passed via env, never inlined, to avoid shell injection.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$PR_TITLE"

  quality-gate:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Setup Python
        run: uv python install 3.12

      - name: 📦 Install Dependencies
        # --all-packages installs every workspace member's runtime deps (server +
        # robot), required for mypy's pydantic plugin and full type resolution.
        run: uv sync --all-packages --all-groups

      - name: 🔍 Lint (Ruff)
        run: uv run ruff check .

      - name: 🎨 Format Check (Ruff)
        run: uv run ruff format --check .

      - name: 🧠 Type Check (MyPy)
        run: uv run mypy --config-file=pyproject.toml server/src robot/src

      - name: 🧹 Dead Code (Vulture)
        run: uv run vulture --min-confidence 80 server/src robot/src

      - name: 📦 Dependency Hygiene (deptry)
        # deptry has no workspace mode; run once per member (config lives in each
        # member's pyproject.toml).
        run: |
          uv run --directory server deptry .
          uv run --directory robot deptry .

      - name: 🔐 Security Audit (Ruff S & pip-audit)
        # Mirrors `just audit`: Ruff's flake8-bandit (S) rules + dependency CVE scan.
        run: |
          uv run ruff check --select S server/src robot/src
          uv run pip-audit --local

  tests:
    name: 🧪 Automated Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: 🐍 Setup Python
        run: uv python install 3.12

      - name: 🔊 System libraries
        # sounddevice needs PortAudio; OpenCV (cv2) needs libGL/glib at import time.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libglib2.0-0

      - name: 📦 Install Dependencies
        run: uv sync --all-packages --all-groups

      - name: 🏃 Run Pytest
        # Hermetic gate: exclude integration (hardware/API keys) and slow (model
        # downloads / audio synthesis — flaky on CI). Those run locally and at
        # release time (cz pre_bump_hooks run the full suite with the 80% gate).
        run: uv run pytest -m "not integration and not slow" --cov=server/src --cov=robot/src --cov-report=xml --cov-fail-under=0

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional for public repos
