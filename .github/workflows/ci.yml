name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: read-only token by default; grant more per-job if ever needed.
permissions:
  contents: read

# Cancel superseded runs on the same PR to save minutes. Never cancel push/main
# runs (each commit on main should get a complete, recorded run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-lint:
    name: 📝 PR Title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: ✅ Validate PR title
        # Squash-merge uses the PR title as the commit message on main, so it
        # must be a valid Conventional Commit for Commitizen versioning. The
        # title is passed via env, never inlined, to avoid shell injection.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$PR_TITLE"

  quality-gate:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Setup Python
        run: uv python install 3.12

      - name: 🔒 Verify lock is in sync
        run: uv lock --check

      - name: 📦 Install Dependencies
        # --all-packages installs every workspace member's runtime deps (server +
        # robot), required for mypy's pydantic plugin and full type resolution.
        # --locked refuses to silently re-resolve if the committed lock drifted.
        run: uv sync --locked --all-packages --all-groups

      - name: 🔍 Lint (Ruff)
        run: uv run ruff check .

      - name: 🎨 Format Check (Ruff)
        run: uv run ruff format --check .

      - name: 🧠 Type Check (MyPy)
        run: uv run mypy --config-file=pyproject.toml server/src robot/src

      - name: 🧠 Type Check (Pyright)
        run: uv run pyright

      - name: 🧹 Dead Code (Vulture)
        run: uv run vulture --min-confidence 80 server/src robot/src

      - name: 📦 Dependency Hygiene (deptry)
        # deptry has no workspace mode; run once per member (config lives in each
        # member's pyproject.toml).
        run: |
          uv run --directory server deptry .
          uv run --directory robot deptry .

      - name: 🔐 Security Audit (Ruff S & pip-audit)
        # Mirrors `just audit`: Ruff's flake8-bandit (S) rules + dependency CVE scan.
        run: |
          uv run ruff check --select S server/src robot/src
          uv run pip-audit --local

      - name: 🏗️ Build both workspace packages
        # Confirms server and robot both build from the committed lock — cheap
        # insurance against a packaging regression reaching a release.
        run: uv build --all-packages

  tests:
    name: 🧪 Automated Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: 🐍 Setup Python
        run: uv python install 3.12

      - name: 🔊 System libraries
        # sounddevice needs PortAudio; OpenCV (cv2) needs libGL/glib at import time.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libglib2.0-0

      - name: 📦 Install Dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: 🏃 Run Pytest
        # Deterministic gate: excludes only slow (real local model
        # inference — Whisper/Piper, downloads/loads actual models),
        # hardware (needs a real camera/microphone), and eval (model-quality
        # grading, not correctness). Every `integration` test already runs
        # against local, deterministic resources only (a temporary SQLite DB,
        # ASGI TestClient) — Plan 0037 found none needing real hardware or
        # external network, so excluding the whole marker was never
        # justified. The excluded suites still run locally and at release
        # time (cz pre_bump_hooks runs the full suite with the same 80% gate).
        run: uv run pytest -m "not slow and not hardware and not eval" --cov=server/src --cov=robot/src --cov-report=xml --cov-fail-under=80

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional for public repos
