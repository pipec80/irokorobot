name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: 🐍 Setup Python
        run: uv python install 3.12

      - name: 📦 Install Dependencies
        # --all-packages installs every workspace member's runtime deps (server +
        # robot), required for mypy's pydantic plugin and full type resolution.
        run: uv sync --all-packages --all-groups

      - name: 🔍 Lint (Ruff)
        run: uv run ruff check .

      - name: 🎨 Format Check (Ruff)
        run: uv run ruff format --check .

      - name: 🧠 Type Check (MyPy)
        run: uv run mypy --config-file=pyproject.toml server/src robot/src

      - name: 🔐 Security Audit (Ruff S & pip-audit)
        # Mirrors `just audit`: Ruff's flake8-bandit (S) rules + dependency CVE scan.
        run: |
          uv run ruff check --select S server/src robot/src
          uv run pip-audit --local

  tests:
    name: 🧪 Automated Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 🐍 Setup Python
        run: uv python install 3.12

      - name: 🔊 System libraries
        # sounddevice needs PortAudio; OpenCV (cv2) needs libGL/glib at import time.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libglib2.0-0

      - name: 📦 Install Dependencies
        run: uv sync --all-packages --all-groups

      - name: 🏃 Run Pytest
        # Integration tests need real hardware/API keys unavailable on CI runners.
        # The full suite (incl. the 80% coverage gate) runs locally at release time.
        run: uv run pytest -m "not integration" --cov=server/src --cov=robot/src --cov-report=xml --cov-fail-under=0

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional for public repos
