name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan (Mondays 04:23 UTC) to catch newly published queries.
    - cron: "23 4 * * 1"

# Least privilege by default; the analyze job elevates only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    # Pinned (2026-11-11): on ubuntu-26.04, the new ubuntu-latest, PortAudio 19.7 fails to
    # initialize without a PulseAudio server, so importing sounddevice errors in 14 test files.
    # Back to ubuntu-latest once that image runs the suite.
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload results to the Security tab
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
