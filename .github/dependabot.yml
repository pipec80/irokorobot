version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    # Bundle safe (minor/patch) Python updates into a single PR to avoid an
    # avalanche. Major bumps stay as individual PRs for deliberate review.
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    # One PR for all GitHub Actions bumps.
    groups:
      github-actions:
        patterns:
          - "*"
