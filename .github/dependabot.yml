version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    # nvidia-cublas-cu12 (the optional `cuda` extra of server/pyproject.toml) is capped on
    # purpose: 12.9.3.13 ships Linux wheels only, so `uv sync --extra cuda` fails on Windows
    # (Dependabot #237 and #247). Remove this ignore when a release has a win_amd64 wheel again.
    ignore:
      - dependency-name: "nvidia-cublas-cu12"
    # Bundle safe (minor/patch) Python version updates and security updates
    # separately. Major version bumps stay individual for deliberate review.
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    # Keep routine and security updates in separate grouped PRs.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
