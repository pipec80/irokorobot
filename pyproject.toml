[project]
name = "omnibotpipec"
version = "0.1.0"
description = "Omnibot core services and automation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Felipe Castro", email = "pipec800@gmail.com" }
]
maintainers = [
  { name = "Felipe Castro", email = "pipec800@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["automation", "bot", "ai", "backend", "services"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://github.com/pipec80/irokorobot"
Repository = "https://github.com/pipec80/irokorobot"
Issues = "https://github.com/pipec80/irokorobot/issues"

[tool.uv.workspace]
members = ["server", "robot"]

[tool.uv]
required-version = ">=0.6.0"
resolution = "highest"
python-preference = "managed"
link-mode = "hardlink"
add-bounds = "major"
prerelease = "disallow"
default-groups = ["dev"]

[tool.uv.sources]
# pytorch-cpu index avoids shm.dll issues on Windows and keeps the wheel CPU-only
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.pip]
compile-bytecode = true

[dependency-groups]
dev = [
    "commitizen>=4.13.10,<5.0.0",
    "deptry>=0.22,<1.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "faker>=40.36.0,<41.0",
    "mypy>=2.3.0,<3.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pyright>=1.1.409,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.16.1,<1.0.0",
    "time-machine>=2.16,<3.0",
    "types-pyyaml>=6.0.12.20260518,<7.0.0.0",
    "vulture>=2.16,<3.0",
]
docs = [
    "mkdocs-material>=9.6,<10.0",
    "mkdocstrings[python]>=1.0.6,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    "scripts",
    ".agent",
    ".vscode",
    ".docs",
    ".claude",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "env",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RET",
    "PT",
    "N",
    "ERA",
    "RUF",

    # 🔐 Seguridad
    "S",

    # 🧠 Tipado
    "ANN",
    "TCH",

    # 🧾 Debug prints
    "T20",

    # 🧠 Pylint (opcional pero potente)
    "PL",

    # 🎯 Argumentos no usados
    "ARG",
]

ignore = [
    "E501",
    "PLR0913",
    "RUF012"
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

"tests/**/*.py" = [
    "S101",     # asserts permitidos aquí
    "ANN",
    "ARG001",
    "PLR2004",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = true
mypy-init-return = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "redundant-cast",
    "unused-awaitable",
]

# =========================
# UX / DEBUG
# =========================
pretty = true
show_error_codes = true
show_column_numbers = true
show_absolute_path = true

# =========================
# PERFORMANCE
# =========================
incremental = true
cache_dir = ".mypy_cache"

# =========================
# IMPORTS (FIXED)
# =========================
follow_imports = "silent"

# ❌ eliminado global
# ignore_missing_imports = true

# =========================
# CORE TYPE SAFETY
# =========================
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

# =========================
# OPTIONALS
# =========================
no_implicit_optional = true
strict_optional = true

# =========================
# WARNINGS
# =========================
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

# =========================
# ANY CONTROL
# =========================
disallow_any_generics = true
disallow_subclassing_any = true

# =========================
# QUALITY
# =========================
strict_equality = true

# =========================
# EXCLUDE (solo build)
# =========================
exclude = [
    "build/",
    "dist/",
    "scripts/",
]

# =========================
# OVERRIDES
# =========================

# Librerías externas sin stubs
[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "sounddevice.*",
    "piper.*",
    "sqlite_vec.*",
    "soxr.*",
    "insightface.*",
    "onnxruntime.*",
]
ignore_missing_imports = true


[tool.commitizen]
name = "cz_conventional_commits"

# 🔢 Versioning (Conectado a la tabla [project])
version_provider = "pep621"
# Opcional: Si quieres que también actualice la versión dentro del código Python
version_files = []

# 📜 Changelog automático
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true

# 🧠 Estilo de commits
tag_format = "v$version"
version_scheme = "semver"

# 💥 Breaking changes
# Mantiene comportamiento seguro mientras estás en 0.x.x
major_version_zero = true

# 🎯 UX & Seguridad
annotated_tag = true
gpg_sign = false

# 🛡️ CI/CD Safe (CRÍTICO)
# Evita loops infinitos en pipelines automáticos
bump_message = "chore(release): bump version $current_version -> $new_version [skip ci]"

# 🚀 Guardián pre-release (Evita lanzar código roto)
pre_bump_hooks = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run mypy --config-file=pyproject.toml server/src robot/src",
    "uv run pytest -n auto --cov --cov-fail-under=80",
]

# -----------------------------------------------------------------------------
# Coverage (Medición de pruebas)
# -----------------------------------------------------------------------------

[tool.coverage.run]
# Define qué carpetas medir.
# En tu caso, los paquetes reales dentro de src-layout.
source = ["server/src", "robot/src"]
branch = true  # Mide cobertura de caminos (if/else), no solo líneas.

[tool.coverage.report]
# No midas archivos de tests o de sistema
omit = [
    "**/tests/*",
    "**/__init__.py",
    "**/conftest.py",
    "**/__main__.py",
]
# Muestra qué líneas faltan por probar en la terminal
show_missing = true
# Si la cobertura baja de este número, el test falla (ideal para CI/CD)
fail_under = 80
# Formato amigable para humanos
precision = 2

[tool.coverage.html]
directory = "docs/coverage_report"

# -----------------------------------------------------------------------------
# TESTING (Pytest)
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
# Estándar de carpetas para tu monorepo
testpaths = ["tests"]
python_files = ["test_*.py"]

# Añadimos los src de los subproyectos al path
pythonpath = [
    "server/src",
    "robot/src",
    "."
]

# Configuración de ejecución
addopts = [
    "--strict-markers",
    "--tb=short",
    "--asyncio-mode=auto",
]

# Organización de tests
markers = [
    "integration: requiere hardware real o APIs externas (Claude/Whisper)",
    "slow: tests que demoran por procesamiento de audio o modelos",
    "unit: lógica pura sin dependencias de red o disco",
]

# Warnings tratados como errores (catch deprecations early)
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:piper.*",
    "ignore::DeprecationWarning:faster_whisper.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Configuración de filtrado de logs (útil cuando Whisper/FastAPI tiran mucho ruido)
log_cli = true
log_cli_level = "INFO"
