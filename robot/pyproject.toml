[project]
name = "robot"
version = "0.1.0"
description = "OMNiBot 2000 — Raspberry Pi 5 audio client"
readme = "README.md"
authors = [
    { name = "Felipe Castro", email = "pipec800@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "numpy>=2.5.1,<3.0.0",
    "onnxruntime>=1.28.0,<2.0.0",
    "opencv-python>=5.0.0.93,<6.0.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sounddevice>=0.5.1,<1.0.0",
]

[project.scripts]
robot = "robot.app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# deptry runs scoped to this subpackage (uv run --directory robot deptry .),
# so its config lives here rather than the workspace root — it does not see
# the root's virtual [project.dependencies]=[] otherwise.
[tool.deptry]
# deptry can't auto-detect this editable workspace member as first-party,
# so it misreads `robot` importing itself as a transitive dependency.
known_first_party = ["robot"]
